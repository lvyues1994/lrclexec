name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.preset }} / ${{ matrix.rmw }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            cc: gcc
            cxx: g++
            rmw: rmw_fastrtps_cpp
          - preset: asan-clang
            cc: clang
            cxx: clang++
            rmw: rmw_fastrtps_cpp
          - preset: debug
            cc: gcc
            cxx: g++
            rmw: rmw_cyclonedds_cpp
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}
      ASAN_OPTIONS: abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: lvyues1994/lexec
          ref: e032d551d53d87209b83d07fd172890461db643b
          path: .deps/lexec
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: "false"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl
          curl --fail --location --silent --show-error \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb \
            --output /tmp/ros2-apt-source.deb
          printf '%s  %s\n' \
            f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296 \
            /tmp/ros2-apt-source.deb | sha256sum --check
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-rt-dev cmake ninja-build \
            python3 libtbb-dev \
            ros-jazzy-ament-cmake ros-jazzy-rclcpp \
            ros-jazzy-rclcpp-action ros-jazzy-example-interfaces \
            ros-jazzy-rosgraph-msgs ros-jazzy-std-msgs \
            ros-jazzy-rmw-fastrtps-cpp ros-jazzy-rmw-cyclonedds-cpp

      - name: Configure, build and test
        run: |
          source /opt/ros/jazzy/setup.bash
          cmake --version
          "$CXX" --version
          uv --version
          test "$(git -C .deps/lexec rev-parse HEAD)" = \
            e032d551d53d87209b83d07fd172890461db643b
          cmake --preset "${{ matrix.preset }}" \
            -DLRCLEXEC_LEXEC_SOURCE_DIR="$GITHUB_WORKSPACE/.deps/lexec" \
            -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DLRCLEXEC_BUILD_TESTS=ON \
            -DLRCLEXEC_BUILD_EXAMPLES=OFF \
            -DLRCLEXEC_BUILD_NAV2_EXAMPLE=OFF \
            -DLRCLEXEC_BUILD_MUJOCO_SIM=OFF \
            -DLRCLEXEC_INSTALL=ON \
            -DLRCLEXEC_BUNDLE_LEXEC_HEADERS=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          ctest --preset "${{ matrix.preset }}" \
            --parallel 1 --output-on-failure --no-tests=error

      - name: Print failure log
        if: failure()
        run: |
          log="build/${{ matrix.preset }}/Testing/Temporary/LastTest.log"
          if [[ -f "$log" ]]; then
            cat "$log"
          fi
